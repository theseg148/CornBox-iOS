name: CornBox
options:
  bundleIdPrefix: com.abx
  deploymentTarget:
    iOS: "16.0"

targets:
  CornBox:
    type: application
    platform: iOS
    sources:
      - path: CornBox/Sources
      - path: CornBox/Resources/app.html
        buildPhase: resources
      - path: CornBox/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: CornBox/Info.plist
      properties:
        CFBundleDisplayName: CornBox
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abx.cornbox
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CornBox:
    build:
      targets:
        CornBox: all
    run:
      config: Debug
    archive:
      config: Release
