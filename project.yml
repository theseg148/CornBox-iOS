name: CornBox
options:
  bundleIdPrefix: com.abx
  deploymentTarget:
    iOS: "17.0"
targets:
  CornBox:
    type: application
    platform: iOS
    sources:
      - path: CornBox/Sources/CornBoxApp.swift
      - path: CornBox/Sources/CornBoxV6.swift
      - path: CornBox/Sources/CornBoxV7.swift
      - path: CornBox/Sources/CornBoxV8Enhancements.swift
      - path: CornBox/Sources/V6PlaybackRepair.swift
      - path: CornBox/Resources/app.html
        buildPhase: resources
      - path: CornBox/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: CornBox/Info.plist
      properties:
        CFBundleDisplayName: CornBox
        CFBundleShortVersionString: "2.3.0"
        CFBundleVersion: "11"
        NSPhotoLibraryUsageDescription: "CornBox uses your photo library so you can add photos and videos to your local collection."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abx.cornbox
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  CornBox:
    build:
      targets:
        CornBox: all
    run:
      config: Debug
    archive:
      config: Release
